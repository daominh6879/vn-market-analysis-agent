services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - ./data/qdrant:/qdrant/storage
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      POSTGRES_DB: ${POSTGRES_DB:-ragdb}
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./data/redis:/data
    command: redis-server --save 60 1 --loglevel warning
    restart: unless-stopped

  minio:
    image: pgsty/minio:latest  # minio/minio removed from Docker Hub; community drop-in fork
    container_name: minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - ./data/minio:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: api
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      QDRANT_HOST: qdrant
      REDIS_URL: redis://redis:6379
      OLLAMA_BASE_URL: ${DOCKER_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8031:8031"
    depends_on:
      - postgres
      - qdrant
      - redis
    restart: unless-stopped

  # Dagster: schedules + sensors (daemon) and UI (webserver), one image, storage in Postgres db `dagster`
  # (create once: docker exec postgres createdb -U admin dagster). See infra/dagster/dagster.yaml.
  dagster-daemon: &dagster
    build:
      context: .
      dockerfile: Dockerfile.dagster
    image: ai-engineer-dagster
    container_name: dagster-daemon
    command: ["dagster-daemon", "run", "-f", "pipeline/assets.py", "-d", "/app"]
    env_file: .env
    environment:
      DAGSTER_HOME: /opt/dagster/home      # .env has the host path for `dagster dev`
      POSTGRES_HOST: postgres
      QDRANT_HOST: qdrant
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: http://minio:9000
      OLLAMA_BASE_URL: ${DOCKER_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres
      - qdrant
      - redis
      - minio
    restart: unless-stopped

  dagster-webserver:
    <<: *dagster
    container_name: dagster-webserver
    command: ["dagster-webserver", "-h", "0.0.0.0", "-p", "3000", "-f", "pipeline/assets.py", "-d", "/app"]
    ports:
      - "127.0.0.1:3000:3000"

  ui:
    build: ./ui/react
    container_name: ui
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - api
    restart: unless-stopped
